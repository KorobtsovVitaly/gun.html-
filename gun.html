<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Krunker Mini - Slow Enemies</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; user-select: none; }
        
        /* Прицел */
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 20px; height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: #0f0;
        }
        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }

        /* Интерфейс */
        #ui {
            position: absolute; bottom: 20px; left: 20px;
            color: white; font-size: 24px; font-weight: bold;
            text-shadow: 2px 2px 0 #000; pointer-events: none;
        }
        
        /* Меню */
        #menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; z-index: 10;
        }
        h1 { font-size: 60px; margin-bottom: 10px; color: #f1c40f; text-transform: uppercase; font-style: italic; }
        p { font-size: 18px; margin-bottom: 30px; }
        button {
            padding: 15px 40px; font-size: 24px; background: #f1c40f; border: none;
            cursor: pointer; font-weight: bold; color: #000;
            box-shadow: 0 5px 0 #d35400; transition: 0.1s;
        }
        button:active { transform: translateY(5px); box-shadow: none; }

        #ammo { position: absolute; bottom: 20px; right: 20px; color: white; font-size: 30px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    
    <div id="ui">
        Здоровье: <span id="hp">100</span><br>
        Убийства: <span id="score">0</span>
    </div>
    <div id="ammo">?</div>

    <div id="menu">
        <h1>KRUNKER MINI</h1>
        <p>WASD - Бегать | ПРОБЕЛ - Прыгать | ЛКМ - Стрелять</p>
        <button id="startBtn">ИГРАТЬ</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        let camera, scene, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        
        let bullets = [];
        let enemies = [];
        let score = 0;
        let hp = 100;
        let isGameActive = false;
        let gun;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 0, 750);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.y = 10;

            const light = new THREE.HemisphereLight(0xeeeeff, 0x777788, 0.75);
            scene.add(light);

            controls = new THREE.PointerLockControls(camera, document.body);

            const menu = document.getElementById('menu');
            const startBtn = document.getElementById('startBtn');

            startBtn.addEventListener('click', () => controls.lock());

            controls.addEventListener('lock', () => {
                menu.style.display = 'none';
                isGameActive = true;
            });

            controls.addEventListener('unlock', () => {
                menu.style.display = 'flex';
                isGameActive = false;
            });

            scene.add(controls.getObject());

            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'ArrowUp': case 'KeyW': moveForward = true; break;
                    case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                    case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                    case 'ArrowRight': case 'KeyD': moveRight = true; break;
                    case 'Space': if (canJump === true) velocity.y += 350; canJump = false; break;
                }
            };

            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'ArrowUp': case 'KeyW': moveForward = false; break;
                    case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                    case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                    case 'ArrowRight': case 'KeyD': moveRight = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', shoot);

            // Пол
            const floorGeometry = new THREE.PlaneGeometry(2000, 2000, 100, 100);
            const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x2ecc71 });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Ящики
            const boxGeo = new THREE.BoxGeometry(20, 20, 20);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0xcd853f });
            for(let i=0; i<50; i++) {
                const box = new THREE.Mesh(boxGeo, boxMat);
                box.position.x = Math.floor(Math.random() * 20 - 10) * 40;
                box.position.z = Math.floor(Math.random() * 20 - 10) * 40;
                box.position.y = 10;
                scene.add(box);
            }

            // Оружие
            const gunGeo = new THREE.BoxGeometry(0.5, 0.5, 2);
            const gunMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
            gun = new THREE.Mesh(gunGeo, gunMat);
            gun.position.set(0.5, -0.5, -1);
            camera.add(gun);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
            setInterval(spawnEnemy, 2000);
        }

        function spawnEnemy() {
            if(!isGameActive) return;
            
            const geo = new THREE.BoxGeometry(5, 10, 5);
            const mat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            const enemy = new THREE.Mesh(geo, mat);
            
            const angle = Math.random() * Math.PI * 2;
            const radius = 100 + Math.random() * 100;
            enemy.position.x = controls.getObject().position.x + Math.cos(angle) * radius;
            enemy.position.z = controls.getObject().position.z + Math.sin(angle) * radius;
            enemy.position.y = 5;
            
            scene.add(enemy);
            enemies.push(enemy);
        }

        function shoot() {
            if(!isGameActive) return;
            gun.position.z = -0.5;
            setTimeout(() => gun.position.z = -1, 100);

            const bulletGeo = new THREE.SphereGeometry(0.2, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            
            bullet.position.copy(controls.getObject().position);
            
            const vector = new THREE.Vector3(0, 0, -1);
            vector.applyQuaternion(camera.quaternion);
            
            bullet.userData = { velocity: vector.multiplyScalar(5) };
            scene.add(bullet);
            bullets.push(bullet);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if(isGameActive) {
                const time = performance.now();
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 100.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 400.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 400.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                controls.getObject().position.y += (velocity.y * delta);

                if (controls.getObject().position.y < 10) {
                    velocity.y = 0;
                    controls.getObject().position.y = 10;
                    canJump = true;
                }

                // Пули
                for(let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    b.position.add(b.userData.velocity);
                    if(b.position.distanceTo(controls.getObject().position) > 200) {
                        scene.remove(b);
                        bullets.splice(i, 1);
                    }
                }

                // Враги (МЕДЛЕННЫЕ)
                for(let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i];
                    e.lookAt(controls.getObject().position);
                    
                    // ИЗМЕНЕНО: Скорость уменьшена с 0.5 до 0.15
                    e.translateZ(0.15); 

                    if(e.position.distanceTo(controls.getObject().position) < 5) {
                        hp -= 1;
                        document.getElementById('hp').innerText = Math.floor(hp);
                        if(hp <= 0) {
                            controls.unlock();
                            alert("GAME OVER! Score: " + score);
                            location.reload();
                        }
                    }

                    for(let j = bullets.length - 1; j >= 0; j--) {
                        const b = bullets[j];
                        if(e.position.distanceTo(b.position) < 5) {
                            scene.remove(e);
                            enemies.splice(i, 1);
                            scene.remove(b);
                            bullets.splice(j, 1);
                            score++;
                            document.getElementById('score').innerText = score;
                            break;
                        }
                    }
                }
                prevTime = time;
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
